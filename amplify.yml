version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
        - node -e "try{require('fs').rmSync('build/types/components',{recursive:true,force:true});}catch(e){}"
        - mkdir -p demo
        - cp icons8-infinity-94.png demo/favicon.png || true
        - |
          cat > demo/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Pardhasaradhi & Dr. Anusha - A responsive and customizable image gallery of our pics and memories.">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
            <link rel="icon" type="image/png" href="favicon.png">
            <link rel="stylesheet" href="demo.mini.css">
            <title>Pardhasaradhi - Dr. Anusha</title>
          </head>
          <body>
            <div id="root" class="gallery-container"></div>
            <script src="demo.mini.js"></script>
          </body>
          </html>
          EOF
        - ls -la demo || true
  artifacts:
    # The production demo build outputs static files to `demo/`
    baseDirectory: demo
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
