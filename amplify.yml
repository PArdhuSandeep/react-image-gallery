version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # The production demo build outputs static files to `demo/`
    baseDirectory: demo
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
